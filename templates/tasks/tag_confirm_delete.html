{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm border-danger">
        <div class="card-header bg-danger text-white py-3">
          <h4 class="card-title mb-0">Delete Tag</h4>
        </div>
        <div class="card-body">
          <p>Are you sure you want to delete the tag <strong>"{{ object.name }}"</strong>?</p>
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">Confirm Delete</button>
              <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
