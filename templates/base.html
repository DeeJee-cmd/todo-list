<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODO List</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid">
  <div class="row min-vh-100">
    <!-- Sidebar -->
    <nav class="col-md-3 col-lg-2 d-md-block bg-white border-end p-3">
      <h4 class="mb-4 text-primary">Menu</h4>
      <ul class="nav nav-pills flex-column">
        <li class="nav-item mb-2">
          <a href="{% url 'tasks:task-list' %}" class="nav-link active">Home page</a>
        </li>
        <li class="nav-item mb-2">
          <a href="{% url 'tasks:tag-list' %}" class="nav-link link-dark">Tag list page</a>
        </li>
      </ul>
    </nav>

    <!-- Main Content -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
