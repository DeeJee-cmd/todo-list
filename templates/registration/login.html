{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
          <h4 class="card-title mb-0 text-center">Login</h4>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            {% if form.non_field_errors %}
              <div class="alert alert-danger py-2">
                {{ form.non_field_errors }}
              </div>
            {% endif %}

            <div class="mb-3">
              <label for="{{ form.username.id_for_label }}" class="form-label fw-bold">Username</label>
              <input type="text" name="username" id="{{ form.username.id_for_label }}" class="form-control" required>
            </div>

            <div class="mb-3">
              <label for="{{ form.password.id_for_label }}" class="form-label fw-bold">Password</label>
              <input type="password" name="password" id="{{ form.password.id_for_label }}" class="form-control"
                     required>
            </div>

            <button type="submit" class="btn btn-primary w-100">Sign In</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
