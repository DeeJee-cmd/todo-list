{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
          <h4 class="card-title mb-0">{% if object %}Update tag{% else %}Create tag{% endif %}</h4>
        </div>
        <div class="card-body">
          <form method="post" novalidate>
            {% csrf_token %}
            <div class="mb-3">
              <label for="{{ form.name.id_for_label }}" class="form-label fw-bold">Name</label>
              {{ form.name }}
              {% if form.name.errors %}
                <div class="text-danger small mt-1">{{ form.name.errors }}</div>
              {% endif %}
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary px-4">Save</button>
              <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
