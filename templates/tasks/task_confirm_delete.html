{% extends "base.html" %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm text-center p-4">
        <div class="text-danger fs-1 mb-2">
          <i class="bi bi-exclamation-triangle"></i>
        </div>
        <h4 class="fw-bold">Delete Task?</h4>
        <p class="text-muted">Are you sure you want to delete "<strong>{{ object.content }}</strong>"? This action
          cannot be undone.</p>

        <form method="post" class="d-flex justify-content-center gap-2 mt-3">
          {% csrf_token %}
          <a href="{% url 'tasks:task-list' %}" class="btn btn-light border">Cancel</a>
          <button type="submit" class="btn btn-danger">
            <i class="bi bi-trash me-1"></i> Confirm Delete
          </button>
        </form>
      </div>
    </div>
  </div>
{% endblock %}
