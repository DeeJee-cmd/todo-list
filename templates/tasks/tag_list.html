{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h2">Tags</h1>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">+ Add tag</a>
  </div>

  <div class="card shadow-sm">
    <div class="card-body p-0">
      <ul class="list-group list-group-flush">
        {% for tag in tag_list %}
          <li class="list-group-item d-flex justify-content-between align-items-center py-3">
            <span class="fw-bold">{{ tag.name }}</span>
            <div>
              <a href="{% url 'tasks:tag-update' tag.pk %}" class="btn btn-sm btn-outline-primary me-1">Update</a>
              <a href="{% url 'tasks:tag-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
          </li>
        {% empty %}
          <li class="list-group-item text-muted text-center py-4">No tags found.</li>
        {% endfor %}
      </ul>
    </div>
  </div>
{% endblock %}
