{% extends "base.html" %}

{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold mb-0">Tags</h2>
      <p class="text-muted small mb-0">Manage category tags for your tasks</p>
    </div>
    <a href="{% url 'tasks:tag-create' %}" class="btn btn-primary">
      <i class="bi bi-plus-lg me-1"></i> Add Tag
    </a>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light">
          <tr>
            <th class="ps-4" style="width: 50%;">Tag Name</th>
            <th class="text-end pe-4">Actions</th>
          </tr>
          </thead>
          <tbody>
          {% for tag in tag_list %}
            <tr>
              <td class="ps-4 fw-semibold">
                                <span class="badge bg-secondary bg-opacity-10 text-secondary border px-2 py-1">
                                    <i class="bi bi-tag-fill me-1"></i>{{ tag.name }}
                                </span>
              </td>
              <td class="text-end pe-4">
                <a href="{% url 'tasks:tag-update' tag.id %}" class="btn btn-sm btn-outline-secondary me-1">
                  <i class="bi bi-pencil me-1"></i> Edit
                </a>
                <a href="{% url 'tasks:tag-delete' tag.id %}" class="btn btn-sm btn-outline-danger">
                  <i class="bi bi-trash me-1"></i> Delete
                </a>
              </td>
            </tr>
          {% empty %}
            <tr>
              <td colspan="2" class="text-center py-4 text-muted">
                No tags found. Click "Add Tag" to create one.
              </td>
            </tr>
          {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
    {% include "includes/pagination.html" %}
  </div>
{% endblock %}
