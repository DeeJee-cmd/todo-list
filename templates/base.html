<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
<div class="container-fluid">
  <div class="row min-vh-100">
    <!-- Sidebar -->
    <aside class="col-md-3 col-lg-2 bg-white border-end p-3 d-flex flex-column">
      <a href="{% url 'tasks:task-list' %}"
         class="d-flex align-items-center mb-4 text-dark text-decoration-none h5 font-bold">
        <i class="bi bi-check2-square text-primary me-2 fs-4"></i> TaskManager
      </a>

      <ul class="nav nav-pills flex-column mb-auto">
        <li class="nav-item">
          <a href="{% url 'tasks:task-list' %}"
             class="nav-link {% if request.resolver_match.url_name == 'task-list' %}active{% else %}text-secondary{% endif %}">
            <i class="bi bi-house-door me-2"></i> Tasks
          </a>
        </li>
        <li class="nav-item">
          <a href="{% url 'tasks:tag-list' %}"
             class="nav-link {% if request.resolver_match.url_name == 'tag-list' %}active{% else %}text-secondary{% endif %}">
            <i class="bi bi-tags me-2"></i> Tags
          </a>
        </li>
      </ul>

      <hr>

      <!-- User Controls -->
      {% if user.is_authenticated %}
        <div class="d-flex align-items-center justify-content-between">
          <span class="small fw-semibold text-truncate me-2"><i
              class="bi bi-person-circle"></i> {{ user.username }}</span>
          <form action="{% url 'logout' %}" method="post" class="m-0">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-danger" title="Logout">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </form>
        </div>
      {% else %}
        <a href="{% url 'login' %}" class="btn btn-sm btn-primary w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i> Login
        </a>
      {% endif %}
    </aside>

    <!-- Main Content -->
    <main class="col-md-9 col-lg-10 p-4">
      {% block content %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
