{% extends "base.html" %}

{% block content %}
  <h1>Delete task</h1>
  <p>Are you sure you want to delete task: "{{ object.content }}"?</p>

  <form action="" method="post">
    {% csrf_token %}
    <button type="submit" style="background: red; color: white;">Confirm Delete</button>
    <a href="{% url 'tasks:task-list' %}">Cancel</a>
  </form>
{% endblock %}
